<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI UV-Vis Spectrum Analyzer - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12h4l3-9 5 18 3-9h3" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your email and we'll send you a link to reset your password.</p>
            </div>

            <!-- Error and Success Messages -->
            <div id="alert-container" style="display: none; margin-bottom: 1.5rem;">
                <div id="alert-box" class="alert" style="padding: 0.75rem 1rem; border-radius: 0.5rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem;">
                    <i id="alert-icon" class="fas"></i>
                    <span id="alert-text"></span>
                </div>
            </div>
            
            <form id="reset-form" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="enter your email" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
            </form>
            
            <div class="login-footer">
                <p>Remember your password? <a href="{{ url_for('login') }}">Sign in</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>

    <script>
        const resetForm = document.getElementById('reset-form');
        const alertContainer = document.getElementById('alert-container');
        const alertBox = document.getElementById('alert-box');
        const alertIcon = document.getElementById('alert-icon');
        const alertText = document.getElementById('alert-text');

        function showAlert(message, type) {
            alertText.textContent = message;
            alertContainer.style.display = 'block';
            if (type === 'success') {
                alertBox.style.backgroundColor = 'rgba(34, 197, 94, 0.1)';
                alertBox.style.border = '1px solid rgba(34, 197, 94, 0.3)';
                alertBox.style.color = 'var(--success)';
                alertIcon.className = 'fas fa-check-circle';
            } else {
                alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                alertBox.style.color = 'var(--danger)';
                alertIcon.className = 'fas fa-exclamation-circle';
            }
        }

        resetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            if (typeof firebase === 'undefined') {
                showAlert('Firebase configuration is missing or invalid.', 'danger');
                return;
            }

            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    showAlert('A password reset link has been sent to ' + email, 'success');
                    resetForm.reset();
                })
                .catch((error) => {
                    showAlert(error.message, 'danger');
                });
        });
    </script>
</body>
</html>
