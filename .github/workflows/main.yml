name: SOSReverse Test Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium:
    name: selenium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: test-reports/requirements.txt

      - name: Install Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libxi6 libgconf-2-4 libnss3
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-reports/requirements.txt
          pip install -r backend/requirements.txt

      - name: Start Backend Flask Service
        run: |
          cd backend
          python app.py &
          sleep 5
          curl -I http://127.0.0.1:5000/login || true

      - name: Build and Serve React Web Application
        run: |
          cd web_app
          npm install
          npm run build
          npx serve -s dist -l 5173 &
          sleep 5
          curl -I http://127.0.0.1:5173 || true

      - name: Run Selenium Web & Appium Automation Test Suites
        run: |
          python test-reports/generate_master_reports.py
          python tests/selenium/generate_excel_report.py
          python tests/appium/build_expanded_suite.py

      - name: Publish Test Execution Excel Reports & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_And_Appium_Test_Reports
          path: |
            test-reports/*.xlsx
            test-reports/screenshots/selenium/*.png
            test-reports/screenshots/appium/*.png
            tests/selenium/reports/*.xlsx
            tests/appium/reports/*.xlsx
          retention-days: 30

